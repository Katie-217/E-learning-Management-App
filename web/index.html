  <!-- Loading indicator styles -->
  <style>
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      opacity: 1 !important;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(128, 128, 128, 0.3);
      border-top-color: #808080;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 18px;
      font-weight: 500;
      margin-top: 10px;
      color: #333333;
    }
    .loading-subtext {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 5px;
      color: #666666;
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">E-Learning Management System</div>
    <div class="loading-subtext">Đang tải ứng dụng...</div>
  </div>
  
  <script>
    // Ensure loading is visible immediately (inline script runs before page fully loads)
    (function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'flex';
        loading.style.opacity = '1';
      }
    })();

    // Hide loading indicator when Flutter app is ready
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s';
        setTimeout(function() {
          loading.style.display = 'none';
        }, 500);
      }
    });

    // Also listen for when Flutter engine is ready
    window.addEventListener('flutter-initialized', function () {
      // Flutter is initializing, keep loading visible
    });

    // Fallback: Hide loading after 15 seconds if Flutter doesn't load
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s';
        setTimeout(function() {
          loading.style.display = 'none';
        }, 500);
      }
    }, 15000);
  </script>
